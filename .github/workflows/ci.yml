name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    name: harness (stdlib Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/*.py

  renderer:
    name: renderer (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subprojects/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check
      # CND-08: no step here calls the Claude API. INT-07: no step prints slide text or uploads a PNG.
      - run: uv run pytest -q

  google:
    name: google (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in subprojects/google/src/*.js; do node --check "$f"; done
      - run: node --test subprojects/google/tests/*.test.js
